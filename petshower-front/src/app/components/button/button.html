@if (appearance === 'fill') {

  <button mat-flat-button [color]="color" [class]="size">
    @if (icon) {
    <mat-icon>{{ icon }}</mat-icon>
    }
    {{ label }}
  </button>

} @else {

  <button mat-button [color]="color" [class]="size">
    @if (icon) {
    <mat-icon>{{ icon }}</mat-icon>
    }
    {{ label }}
  </button>
}
